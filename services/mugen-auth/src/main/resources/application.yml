# Default profile = development on the HOST (IntelliJ / ./mvnw spring-boot:run)
# talking to the dockerized infra through published ports. Every value falls back
# to a working localhost default, so `./mvnw spring-boot:run` works with no
# environment setup at all; the MUGEN_* overrides come from .env Section B when
# they are exported into the run configuration.
#
# The `docker` profile (application-docker.yml) is for when this service is itself
# containerised for deployment — it swaps localhost for Docker network hostnames.

server:
  port: ${AUTH_SERVICE_PORT:8081}
  shutdown: graceful
  error:
    # Never leak stack traces or internal messages to clients — the
    # GlobalExceptionHandler is the only thing allowed to shape error bodies.
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: mugen-auth

  lifecycle:
    timeout-per-shutdown-phase: 20s

  # Java 21 virtual threads: this service is request-per-thread and blocking
  # (JDBC, Redis, HTTP), which is exactly the shape virtual threads help.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${MUGEN_SQLSERVER_URL:jdbc:sqlserver://localhost:1433;databaseName=mugen_auth;encrypt=true;trustServerCertificate=true}
    username: ${MUGEN_SQLSERVER_USER:sa}
    password: ${MUGEN_SQLSERVER_PASSWORD:ChangeMe_Str0ng!}
    hikari:
      pool-name: mugen-auth-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    hibernate:
      # Flyway owns the schema. `validate` makes the app refuse to start if the
      # entities and the migrated schema have drifted apart, which is what you
      # want — `update` would silently paper over a missing migration.
      ddl-auto: validate
    # Off deliberately. open-in-view keeps a JPA session open for the whole
    # request, hiding lazy-loading bugs behind a connection held far too long.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The database itself is created by config/sqlserver/init-db.sh; Flyway only
    # manages schema inside it.
    baseline-on-migrate: false

  data:
    redis:
      host: ${MUGEN_REDIS_HOST:localhost}
      port: ${MUGEN_REDIS_PORT:6379}
      timeout: 2s

  kafka:
    bootstrap-servers: ${MUGEN_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # StringSerializer, not JsonSerializer: this service publishes only from the
      # outbox, where the payload was serialized at write time and is sent
      # byte-for-byte. Handing an already-encoded string to JsonSerializer would
      # encode it a second time and ship a JSON string containing JSON.
      #
      # It also drops JsonSerializer's __TypeId__ header, which is the better
      # contract — that header names a producer-side Java class, and consumers
      # should bind mugen-shared's record by configuration, not inherit
      # mugen-auth's package layout over the wire.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all + idempotence: a registration event must not be lost or
      # duplicated on broker retry. mugen-user and mugen-search both key off it.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Bounded so a broker that is merely unreachable fails the send instead of
        # blocking inside the poller's transaction until its own timeout.
        max.block.ms: 5000
      retries: 3

  mvc:
    problemdetails:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Tolerate fields a newer producer added — same forward-compatibility rule
      # the Kafka event contracts rely on.
      fail-on-unknown-properties: false
    # No write-dates-as-timestamps here: Boot 4 ships Jackson 3, which moved that
    # flag off SerializationFeature and defaults dates to ISO-8601 anyway. Setting
    # it fails context startup with "No enum constant SerializationFeature
    # .write-dates-as-timestamps".

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI (springdoc 3.x — the Boot 4 line; 2.x targets Boot 3).
#
# On here, in the host-run development profile, because being able to exercise
# the API from a browser is the whole point. The `docker` profile turns both off
# — see application-docker.yml for that decision and its reasoning.
#
# The two switches are separate on purpose. The document is a machine-readable
# contract with an obvious later consumer (the gateway aggregating every
# service's docs, Phase 3); the UI is an interactive form that submits real
# credentials. Wanting the first in an environment is not wanting the second.
# ---------------------------------------------------------------------------
springdoc:
  api-docs:
    enabled: ${MUGEN_API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${MUGEN_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    # Endpoints in declaration order would be arbitrary; alphabetical at least
    # puts the same operation in the same place every time you look.
    operations-sorter: alpha
    tags-sorter: alpha
    # Without this the UI silently drops the refresh cookie on /refresh and
    # /logout, and both appear to do nothing when tried from the browser.
    with-credentials: true
  # Everything under /api/v1/auth. Keeps /actuator out of the document, which
  # is operational surface, not API surface, and is not part of the contract
  # any client codes against.
  paths-to-match: /api/v1/auth/**

eureka:
  client:
    service-url:
      defaultZone: ${MUGEN_EUREKA_URI:http://localhost:8761/eureka}
  instance:
    # Host-run services register by IP; the Docker-internal hostname would be
    # unresolvable to anything outside the compose network.
    prefer-ip-address: true

# ---------------------------------------------------------------------------
# JWT — RS256 asymmetric. mugen-auth holds the private key and is the only
# service that can mint a token; mugen-gateway gets public.pem and verifies
# with zero DB calls.
# ---------------------------------------------------------------------------
mugen:
  auth:
    refresh-cookie:
      name: mugen_refresh
      # Scoped to the auth endpoints only. The browser then never attaches this
      # cookie to any other call, so it cannot leak through an unrelated request.
      path: /api/v1/auth
      # Overridable only for a plain-HTTP local setup. Must be true anywhere real.
      # Modern browsers treat localhost as a secure origin, so true works in dev too.
      secure: ${MUGEN_REFRESH_COOKIE_SECURE:true}
      # Strict is what makes disabling CSRF defensible: the browser will not attach
      # this cookie to a cross-site request at all.
      same-site: Strict

    # SSO settings that belong to us. The provider client ids and secrets are
    # Spring Security's own spring.security.oauth2.client.* and live in
    # application-sso.yml — activate the `sso` profile to switch SSO on. Without
    # it these values simply go unused and the /sso endpoints answer 404.
    sso:
      # Only has to cover the time a human spends on a consent screen. Every extra
      # minute is extra window in which a forged callback would still be accepted.
      state-ttl: ${MUGEN_SSO_STATE_TTL_MINUTES:5}m
      # Where the callback sends the browser once the cookie is set. The SPA then
      # calls /refresh to get an access token into memory — which is why the access
      # token never has to travel in a URL, where it would land in browser history,
      # Referer headers and every proxy log on the way.
      default-redirect-uri: ${MUGEN_SSO_DEFAULT_REDIRECT_URI:http://localhost:4200/auth/callback}
      # Exact-match allowlist, not a pattern. This is the only thing standing
      # between ?redirect_uri= and an open redirect that hands a look-alike site a
      # freshly signed-in browser.
      allowed-redirect-uris:
        - ${MUGEN_SSO_DEFAULT_REDIRECT_URI:http://localhost:4200/auth/callback}

  # -------------------------------------------------------------------------
  # Transactional outbox. Events are written to outbox_events in the same
  # transaction as the row they describe, then drained to Kafka from here.
  # See V4__create_outbox_events.sql.
  # -------------------------------------------------------------------------
  outbox:
    # Off only for tests that start the context without a broker.
    enabled: ${MUGEN_OUTBOX_ENABLED:true}
    # Delivery latency for a healthy pipeline is roughly this. Raise batch-size
    # before shortening it — a shorter tick costs a query per instance per tick
    # whether or not there is anything to do.
    poll-interval: ${MUGEN_OUTBOX_POLL_INTERVAL:1s}
    batch-size: ${MUGEN_OUTBOX_BATCH_SIZE:100}
    # The poller holds row locks while it waits, so this is a ceiling on how long
    # one unreachable broker can hold a database connection.
    send-timeout: ${MUGEN_OUTBOX_SEND_TIMEOUT:10s}
    initial-backoff: ${MUGEN_OUTBOX_INITIAL_BACKOFF:2s}
    max-backoff: ${MUGEN_OUTBOX_MAX_BACKOFF:5m}
    # Where a failure stops being plausibly transient and starts logging at ERROR.
    # Nothing is ever discarded — a failing row retries at max-backoff forever.
    alert-after-attempts: ${MUGEN_OUTBOX_ALERT_AFTER_ATTEMPTS:10}
    # How long a delivered event stays queryable before the purge sweep.
    retention: ${MUGEN_OUTBOX_RETENTION:7d}
    purge-interval: ${MUGEN_OUTBOX_PURGE_INTERVAL:1h}

  jwt:
    private-key: ${JWT_PRIVATE_KEY_PATH:classpath:keys/private.pem}
    public-key: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}
    # A URI, not a bare name. RFC 7519 allows either, but Spring's Jwt.getIssuer()
    # returns a URL and throws on anything that will not parse as one — so a bare
    # "mugen-auth" works until the first caller (the gateway) asks for the issuer.
    issuer: https://mugen.dev/auth
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}m
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}d
    revocation-cache-ttl: ${JWT_REVOCATION_CACHE_TTL_MINUTES:15}m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  otlp:
    tracing:
      # OTLP over HTTP, not gRPC — this is why compose publishes Jaeger's 4318.
      endpoint: ${MUGEN_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      # Sample everything in dev. Must be lowered in production.
      probability: 1.0

logging:
  # The traceId a ProblemDetail reports, on every line of the request that produced
  # it. Boot's default here is `traceId-spanId` padded to a fixed 49 columns, which
  # spends half the line on blanks for everything logged outside a request; the span
  # id is in Jaeger anyway, and the trace id is the half a caller can quote.
  pattern:
    correlation: "[%X{traceId:-}] "
  level:
    com.mugen.auth: DEBUG
    # Uncomment when debugging Flyway/JPA schema drift.
    # org.hibernate.SQL: DEBUG
