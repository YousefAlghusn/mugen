global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka:8761"]

  # Application services run on the host (`mvn spring-boot:run`), so the
  # dockerized Prometheus reaches them via host.docker.internal. Each serves its
  # actuator on a management port (908x, next to its API port 808x) that a
  # deployment never publishes.
  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["config-server:8888"]

  - job_name: mugen-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9080"]

  - job_name: mugen-auth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9081"]

  - job_name: mugen-user
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9082"]

  - job_name: mugen-post
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9083"]

  - job_name: mugen-feed
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9084"]

  - job_name: mugen-notification
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9085"]

  - job_name: mugen-payment
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9086"]

  - job_name: mugen-video
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9087"]

  - job_name: mugen-transcode
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9088"]

  - job_name: mugen-search
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9089"]
