# mugen-auth's tunables: what an operator changes, never what a client depends on.
# The refresh cookie's name and path, the endpoint paths and the token claims are
# contracts and stay in the service's own application.yml.

mugen:
  jwt:
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}m
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}d
    # Validated at startup against access-token-ttl: must be at least as long.
    revocation-cache-ttl: ${JWT_REVOCATION_CACHE_TTL_MINUTES:15}m

  auth:
    sso:
      state-ttl: ${MUGEN_SSO_STATE_TTL_MINUTES:5}m

  outbox:
    poll-interval: ${MUGEN_OUTBOX_POLL_INTERVAL:1s}
    batch-size: ${MUGEN_OUTBOX_BATCH_SIZE:100}
    send-timeout: ${MUGEN_OUTBOX_SEND_TIMEOUT:10s}
    initial-backoff: ${MUGEN_OUTBOX_INITIAL_BACKOFF:2s}
    max-backoff: ${MUGEN_OUTBOX_MAX_BACKOFF:5m}
    alert-after-attempts: ${MUGEN_OUTBOX_ALERT_AFTER_ATTEMPTS:10}
    retention: ${MUGEN_OUTBOX_RETENTION:7d}
    purge-interval: ${MUGEN_OUTBOX_PURGE_INTERVAL:1h}

logging:
  level:
    com.mugen.auth: DEBUG
