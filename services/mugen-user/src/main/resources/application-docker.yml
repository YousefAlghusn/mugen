# Profile: docker
#
# Only for when mugen-user is ITSELF running as a container (deployment). In
# development it runs on the host and the default profile applies. The single
# difference is addressing: inside the compose network, infra is reached by
# service name, and Kafka must use the INTERNAL listener (29092).

spring:
  config:
    import: "optional:configserver:http://${CONFIG_SERVER_HOST:config-server}:${CONFIG_SERVER_PORT:8888}"

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_USER_DB:mugen_user}
    username: ${POSTGRES_USER:mugen}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_HOST:kafka}:29092

mugen:
  minio:
    # Signing happens here, against this endpoint, and the browser then GETs the same
    # URL: for a deployment that means MinIO's public address, which is why this is a
    # required variable and has no hostname default.
    endpoint: ${MUGEN_MINIO_PUBLIC_ENDPOINT}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:eureka}:${EUREKA_PORT:8761}/eureka
  instance:
    prefer-ip-address: false

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://${JAEGER_HOST:jaeger}:${JAEGER_OTLP_HTTP_PORT:4318}/v1/traces

springdoc:
  api-docs:
    enabled: ${MUGEN_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${MUGEN_SWAGGER_UI_ENABLED:false}
