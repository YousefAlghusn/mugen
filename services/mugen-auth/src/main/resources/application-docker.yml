# Profile: docker
#
# Only for when mugen-auth is ITSELF running as a container (deployment), built
# from this module's own Dockerfile. It is NOT the development profile — in
# development the service runs on the host and the default profile applies.
#
# The single difference is addressing: inside the compose network, infra is
# reached by service name, and Kafka must use the INTERNAL listener (29092).
# From the host those names do not resolve, and 29092 is not published.

spring:
  datasource:
    url: jdbc:sqlserver://${SQLSERVER_HOST:sqlserver}:${SQLSERVER_PORT:1433};databaseName=${SQLSERVER_DB:mugen_auth};encrypt=true;trustServerCertificate=true
    username: ${SQLSERVER_USER:sa}
    password: ${SQLSERVER_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  kafka:
    # INTERNAL listener. localhost:9092 is the host-facing EXTERNAL one and is
    # meaningless from inside a container.
    bootstrap-servers: ${KAFKA_HOST:kafka}:29092

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:eureka}:${EUREKA_PORT:8761}/eureka
  instance:
    prefer-ip-address: false

management:
  otlp:
    tracing:
      endpoint: http://${JAEGER_HOST:jaeger}:${JAEGER_OTLP_HTTP_PORT:4318}/v1/traces

# ---------------------------------------------------------------------------
# API docs: OFF by default once this service is deployed. Decision, not an
# oversight.
#
# Swagger UI is an interactive form that submits real credentials against
# whatever host is serving it, and it is the one piece of this service with no
# caller in production — clients are built against the document, not against
# the page. Leaving it on means shipping an unauthenticated login form on every
# instance for the benefit of nobody.
#
# The document itself is off with it for the same reason a deployed service does
# not need to describe itself: it is generated at build time from this same code
# whenever a human or a pipeline wants it. When Phase 3 has the gateway
# aggregating per-service docs, that environment turns MUGEN_API_DOCS_ENABLED
# back on — deliberately, per environment, which is the point of it being a
# variable rather than a hardcoded false.
# ---------------------------------------------------------------------------
springdoc:
  api-docs:
    enabled: ${MUGEN_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${MUGEN_SWAGGER_UI_ENABLED:false}
