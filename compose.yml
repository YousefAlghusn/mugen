name: mugen

networks:
  mugen-network:
    driver: bridge

volumes:
  kafka-data:
  redis-data:
  mongodb-data:
  sqlserver-data:
  postgres-data:
  minio-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:

  # ==================================================================
  # Kafka — KRaft mode, single node acting as both controller and broker.
  # No ZooKeeper: it is deprecated by KIP-500 and removed in Kafka 4.0.
  #
  # Three listeners, because three different callers need different addresses:
  #   CONTROLLER 29093 — the KRaft quorum talking to itself
  #   INTERNAL   29092 — other containers, reached as kafka:29092
  #   EXTERNAL    9092 — services running on the host, reached as localhost:9092
  # ==================================================================
  kafka:
    image: apache/kafka:4.0.0
    container_name: mugen-kafka
    networks: [mugen-network]
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required}
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID}@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29093,INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:${KAFKA_PORT}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Single-node dev cluster: skip the rebalance delay so consumers join instantly.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: mugen-kafka-init
    networks: [mugen-network]
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./config/kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    restart: "no"

  # ==================================================================
  # Redis
  # ==================================================================
  redis:
    image: redis:7-alpine
    container_name: mugen-redis
    networks: [mugen-network]
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================================================================
  # MongoDB
  # ==================================================================
  mongodb:
    image: mongo:7
    container_name: mugen-mongodb
    networks: [mugen-network]
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?required}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================================================================
  # SQL Server — mugen-auth
  # ==================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mugen-sqlserver
    networks: [mugen-network]
    ports:
      - "${SQLSERVER_PORT}:${SQLSERVER_PORT}"
    environment:
      ACCEPT_EULA: ${SQLSERVER_ACCEPT_EULA:?required}
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:?required}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U ${SQLSERVER_USER} -P \"${SQLSERVER_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mugen-sqlserver-init
    networks: [mugen-network]
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLSERVER_HOST: ${SQLSERVER_HOST:?required}
      SQLSERVER_USER: ${SQLSERVER_USER:?required}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:?required}
      SQLSERVER_DB: ${SQLSERVER_DB:?required}
    volumes:
      - ./config/sqlserver/init-db.sh:/init-db.sh:ro
    entrypoint: ["bash", "/init-db.sh"]
    restart: "no"

  # ==================================================================
  # Postgres — mugen-user, mugen-payment
  # ==================================================================
  postgres:
    image: postgres:16-alpine
    container_name: mugen-postgres
    networks: [mugen-network]
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_USER_DB:?required}
      POSTGRES_PAYMENT_DB: ${POSTGRES_PAYMENT_DB:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================================================================
  # MinIO — object storage
  # ==================================================================
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: mugen-minio
    networks: [mugen-network]
    ports:
      - "${MINIO_API_PORT}:${MINIO_API_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_API_PORT}/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: mugen-minio-init
    networks: [mugen-network]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_BUCKET_AVATARS: ${MINIO_BUCKET_AVATARS}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW}
      MINIO_BUCKET_HLS: ${MINIO_BUCKET_HLS}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA}
    entrypoint: >
      /bin/sh -c "
      mc alias set local $${MINIO_ENDPOINT} $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_AVATARS} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_RAW} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_HLS} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_MEDIA} &&
      echo 'MinIO buckets ready.'
      "
    restart: "no"

  # ==================================================================
  # Elasticsearch — mugen-search
  # ==================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: mugen-elasticsearch
    networks: [mugen-network]
    ports:
      - "${ELASTICSEARCH_PORT}:${ELASTICSEARCH_PORT}"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${ELASTICSEARCH_PORT}/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ==================================================================
  # Eureka — service discovery (standalone Spring Boot app, built locally)
  # ==================================================================
  eureka:
    build:
      context: ./eureka-server
    container_name: mugen-eureka
    networks: [mugen-network]
    ports:
      - "${EUREKA_PORT}:${EUREKA_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${EUREKA_PORT}/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================================================================
  # Observability — Jaeger, Prometheus, Loki, Grafana
  # ==================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: mugen-jaeger
    networks: [mugen-network]
    ports:
      - "${JAEGER_UI_PORT}:${JAEGER_UI_PORT}"
      - "${JAEGER_OTLP_GRPC_PORT}:${JAEGER_OTLP_GRPC_PORT}"
      # Spring Boot's management.otlp.tracing exporter speaks OTLP over HTTP,
      # not gRPC — without 4318 published, host-run services emit into a void.
      - "${JAEGER_OTLP_HTTP_PORT}:${JAEGER_OTLP_HTTP_PORT}"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${JAEGER_UI_PORT} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mugen-prometheus
    networks: [mugen-network]
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PROMETHEUS_PORT}/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:2.9.6
    container_name: mugen-loki
    networks: [mugen-network]
    ports:
      - "${LOKI_PORT}:${LOKI_PORT}"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${LOKI_PORT}/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    container_name: mugen-grafana
    networks: [mugen-network]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_PORT}"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
    volumes:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${GRAFANA_PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
