# Two backends, one active at a time, chosen by profile:
#
#   native — the checked-in config-repo/ directory, mounted into the container
#            read-only by compose.yml. The dev default: edit a file, restart or
#            refresh the service, done. No git plumbing between a change and its
#            effect.
#   git    — a repository URI, for deployment. The same files, versioned and
#            reviewable, fetched on each request (with the default clone-on-start).
#
# Nothing secret is ever served from here — see tasks.md 3.5.4. Passwords, OAuth
# secrets and keys stay environment variables resolved by each service, which is
# why this server carries no encryption key and no {cipher} values.

server:
  port: ${CONFIG_SERVER_PORT:8888}

spring:
  application:
    name: config-server
  profiles:
    active: ${CONFIG_SERVER_PROFILE:native}
  cloud:
    config:
      server:
        native:
          search-locations: file:${CONFIG_REPO_PATH:/config-repo}
        git:
          uri: ${CONFIG_REPO_GIT_URI:https://example.invalid/mugen-config.git}
          default-label: ${CONFIG_REPO_GIT_BRANCH:main}
          # Fail at startup, not on the first client request, if the repo is unreachable.
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
